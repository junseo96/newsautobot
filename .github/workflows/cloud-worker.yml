name: Cloud worker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production worker
        run: docker build -f deploy/cloud/Dockerfile -t newsautobot:test .
      - name: Regression tests with PowerShell and fake senders
        run: docker run --rm --entrypoint python3 newsautobot:test -X utf8 -m unittest discover -s outputs/rss-news-monitor -p 'test_*.py' -v
      - name: State migration and activation checks
        run: docker run --rm --entrypoint python3 newsautobot:test -m unittest discover -s deploy/cloud -p 'test_*.py' -v
      - name: Refuse activation without production state and credentials
        shell: bash
        run: |
          set +e
          docker run --rm -e NEWS_SERVICE_ENABLED=true newsautobot:test run
          result=$?
          set -e
          test "$result" -eq 2
