name: Scheduled news runtime

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Import the verified latest state.tar.age from release news-state-bootstrap (first migration or manual recovery only; starts real processing)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Never cancel an active sender. Pending scheduled runs may be coalesced by GitHub.
concurrency:
  group: newsautobot-production
  cancel-in-progress: false

jobs:
  cycle:
    if: vars.NEWS_SERVICE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEWS_CODEX_API_KEY: ${{ secrets.NEWS_CODEX_API_KEY }}
      NEWS_GMAIL_CLIENT_ID: ${{ secrets.NEWS_GMAIL_CLIENT_ID }}
      NEWS_GMAIL_CLIENT_SECRET: ${{ secrets.NEWS_GMAIL_CLIENT_SECRET }}
      NEWS_GMAIL_REFRESH_TOKEN: ${{ secrets.NEWS_GMAIL_REFRESH_TOKEN }}
      NEWS_TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_TELEGRAM_BOT_TOKEN }}
      NEWS_TELEGRAM_CHAT_ID: ${{ secrets.NEWS_TELEGRAM_CHAT_ID }}
      NEWS_DART_KEY: ${{ secrets.NEWS_DART_KEY }}
      NEWS_GRID_TOKEN: ${{ secrets.NEWS_GRID_TOKEN }}
      NEWS_STATE_AGE_KEY: ${{ secrets.NEWS_STATE_AGE_KEY }}
      NEWS_GRID_URL: ${{ vars.NEWS_GRID_URL || 'https://us-grid-observatory.hjunseo96.chatgpt.site' }}
      NEWS_MODEL: ${{ vars.NEWS_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate execution context
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python3 - <<'PY'
          import os
          required = ('NEWS_CODEX_API_KEY', 'NEWS_GMAIL_CLIENT_ID', 'NEWS_GMAIL_CLIENT_SECRET',
                      'NEWS_GMAIL_REFRESH_TOKEN', 'NEWS_TELEGRAM_BOT_TOKEN', 'NEWS_TELEGRAM_CHAT_ID',
                      'NEWS_DART_KEY', 'NEWS_GRID_URL', 'NEWS_GRID_TOKEN', 'NEWS_STATE_AGE_KEY')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing Actions secrets/variables: ' + ', '.join(missing))
          PY
          mkdir -p "$RUNNER_TEMP/news-state"
          chmod 755 "$RUNNER_TEMP/news-state"
      - name: Download latest checkpoint
        if: ${{ !inputs.bootstrap }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/cloud/github_state.py download --destination "$RUNNER_TEMP/news-state/state.tar.age"
      - name: Import operator-prepared encrypted checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download news-state-bootstrap --repo "$GITHUB_REPOSITORY" --pattern state.tar.age --dir "$RUNNER_TEMP/news-state"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/cloud/Dockerfile
          load: true
          tags: newsautobot:runtime
          cache-from: type=gha,scope=news-worker
          cache-to: type=gha,mode=max,scope=news-worker
      - name: Verify runtime code before processing
        run: |
          docker run --rm --entrypoint python3 newsautobot:runtime -X utf8 -m unittest discover -s outputs/rss-news-monitor -p 'test_*.py'
          docker run --rm --entrypoint python3 newsautobot:runtime -m unittest discover -s deploy/cloud -p 'test_*.py'
      - name: Restore and audit history
        id: restore
        run: |
          chmod 644 "$RUNNER_TEMP/news-state/state.tar.age"
          docker volume create newsautobot-state
          docker run --rm -e NEWS_STATE_AGE_KEY -v newsautobot-state:/var/lib/newsflow -v "$RUNNER_TEMP/news-state:/transfer:ro" --entrypoint python3 newsautobot:runtime /app/deploy/cloud/artifact_state.py decrypt --archive /transfer/state.tar.age --destination /var/lib/newsflow/state
          docker run --rm -v newsautobot-state:/var/lib/newsflow newsautobot:runtime audit
      - name: Verify remote connections before first activation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: |
          docker run --rm -e NEWS_CODEX_API_KEY -e NEWS_GMAIL_CLIENT_ID -e NEWS_GMAIL_CLIENT_SECRET -e NEWS_GMAIL_REFRESH_TOKEN -e NEWS_TELEGRAM_BOT_TOKEN -e NEWS_TELEGRAM_CHAT_ID -e NEWS_DART_KEY -e NEWS_GRID_URL -e NEWS_GRID_TOKEN -e NEWS_MODEL --entrypoint python3 newsautobot:runtime /app/deploy/cloud/probe.py
      - name: Process news and drain in-flight work
        id: run
        run: |
          docker run --name newsautobot-cycle -v newsautobot-state:/var/lib/newsflow -e NEWS_SERVICE_ENABLED=true -e NEWS_CODEX_API_KEY -e NEWS_GMAIL_CLIENT_ID -e NEWS_GMAIL_CLIENT_SECRET -e NEWS_GMAIL_REFRESH_TOKEN -e NEWS_TELEGRAM_BOT_TOKEN -e NEWS_TELEGRAM_CHAT_ID -e NEWS_DART_KEY -e NEWS_GRID_URL -e NEWS_GRID_TOKEN -e NEWS_MODEL newsautobot:runtime cycle --seconds 600
      - name: Attempt to drain an interrupted container
        if: ${{ always() && steps.restore.outcome == 'success' && steps.run.outcome == 'cancelled' }}
        run: |
          if test "$(docker inspect --format '{{.State.Running}}' newsautobot-cycle)" = "true"; then
            docker stop --time 180 newsautobot-cycle
          fi
      - name: Encrypt the latest stopped state
        id: checkpoint
        if: ${{ always() && steps.restore.outcome == 'success' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure' || steps.run.outcome == 'cancelled') }}
        run: |
          test "$(docker inspect --format '{{.State.Running}}' newsautobot-cycle)" = "false"
          docker run --name newsautobot-checkpoint -e NEWS_STATE_AGE_KEY -v newsautobot-state:/var/lib/newsflow --entrypoint python3 newsautobot:runtime /app/deploy/cloud/artifact_state.py encrypt --root /var/lib/newsflow/state --destination /tmp/state.tar.age --stopped
          mkdir -p "$RUNNER_TEMP/news-checkpoint"
          docker cp newsautobot-checkpoint:/tmp/state.tar.age "$RUNNER_TEMP/news-checkpoint/state.tar.age"
      - name: Preserve encrypted state for the next run
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: newsautobot-state
          path: ${{ runner.temp }}/news-checkpoint/state.tar.age
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove runner-local decrypted state
        if: ${{ always() }}
        run: |
          docker rm -f newsautobot-cycle newsautobot-checkpoint 2>/dev/null || true
          docker volume rm newsautobot-state 2>/dev/null || true
